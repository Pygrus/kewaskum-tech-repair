*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── Header ──────────────────────────────────────────── */
.site-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--navy);
  color: #fff;
  padding: 14px 20px 10px;
  margin-left: max(-16px, calc(-1 * env(safe-area-inset-left, 16px)));
  margin-right: max(-16px, calc(-1 * env(safe-area-inset-right, 16px)));
}
.header-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.header-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
.header-sub { font-size: 11px; opacity: .65; margin-top: 1px; }
.progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.progress-bar-wrap { flex: 1; height: 5px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; }
.progress-bar { height: 100%; background: #69f0ae; border-radius: 3px; transition: width .4s ease; }
.progress-label { font-size: 11px; opacity: .75; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ── Filters ──────────────────────────────────────────── */
.filters {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  z-index: 15;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 8px 0;
  margin-left: max(-16px, calc(-1 * env(safe-area-inset-left, 16px)));
  margin-right: max(-16px, calc(-1 * env(safe-area-inset-right, 16px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter-btn {
  padding: 4px 11px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--fg2); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all .15s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--navy); border-color: var(--navy); color: #fff; }
.filter-label { font-size: 11px; color: var(--fg3); margin-right: 2px; }
.filter-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }

/* ── Main ──────────────────────────────────────────── */
.main { max-width: 820px; margin: 0 auto; padding-block: 20px; }

/* ── Section ──────────────────────────────────────────── */
.section { margin-bottom: 24px; }
.section-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--navy);
  color: #fff;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  user-select: none;
}
.section-num {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px; font-weight: 700; opacity: .6; letter-spacing: .5px;
}
.section-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600; flex: 1; }
.section-count { font-size: 11px; opacity: .6; white-space: nowrap; font-variant-numeric: tabular-nums; }
.section-chevron { font-size: 10px; opacity: .5; transition: transform .2s; }
.section.collapsed .section-chevron { transform: rotate(-90deg); }
.section-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 8px 8px; overflow: hidden; }
.section.collapsed .section-body { display: none; }

/* ── Task row ──────────────────────────────────────────── */
.task {
  display: grid;
  grid-template-columns: 32px 1fr auto;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  transition: background .1s;
}
.task:last-child { border-bottom: none; }
.task:hover { background: var(--surface2); }
.task.done { background: var(--done-bg); }
.task.hidden { display: none; }

.task-check-col {
  display: flex; align-items: flex-start; justify-content: center;
  padding: 12px 0 12px 10px;
}
.task-check {
  width: 18px; height: 18px; border-radius: 4px;
  border: 2px solid var(--border);
  background: var(--surface);
  cursor: pointer; flex-shrink: 0; margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.task-check:hover { border-color: var(--accent); }
.task.done .task-check { background: var(--green); border-color: var(--green); }
.task-check-icon { font-size: 11px; color: #fff; display: none; }
.task.done .task-check-icon { display: block; }

.task-body { padding: 11px 10px 11px 8px; min-width: 0; }
.task-name {
  font-size: 13px; font-weight: 500; color: var(--fg); line-height: 1.4;
  transition: color .15s;
}
.task.done .task-name { color: var(--done-fg); text-decoration: line-through; }
.task-critical { font-size: 10px; font-weight: 600; color: var(--amber); letter-spacing: .3px; }
.task-note {
  font-size: 11.5px; color: var(--fg2); margin-top: 3px; line-height: 1.4;
}
.task.done .task-note { color: var(--done-fg); }
.task-meta { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
.task-deadline { font-size: 10.5px; color: var(--fg3); font-variant-numeric: tabular-nums; }

.task-owner-col {
  display: flex; align-items: flex-start;
  padding: 11px 10px 11px 4px;
}

/* ── Owner pill selector ──────────────────────────────── */
.owner-select {
  position: relative;
}
.owner-pill {
  display: flex; align-items: center; gap: 5px;
  padding: 3px 9px 3px 7px;
  border-radius: 20px; border: 1.5px solid transparent;
  font-size: 11px; font-weight: 600;
  cursor: pointer; white-space: nowrap;
  transition: all .15s;
  user-select: none;
}
.owner-pill:hover { opacity: .85; }
.owner-pill.anthony { background: var(--anthony-bg); color: var(--anthony); border-color: var(--anthony); }
.owner-pill.brian   { background: var(--brian-bg);   color: var(--brian);   border-color: var(--brian); }
.owner-pill.both    { background: var(--both-bg);     color: var(--both);    border-color: var(--both); }
.owner-pill.unassigned { background: var(--unassigned-bg); color: var(--unassigned); border-color: var(--border); }

.owner-dropdown {
  position: absolute; right: 0; top: calc(100% + 4px);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  min-width: 140px; z-index: 100; overflow: hidden;
  display: none;
}
.owner-dropdown.open { display: block; }
.owner-opt {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; cursor: pointer; font-size: 12px; font-weight: 500;
  transition: background .1s;
}
.owner-opt:hover { background: var(--surface2); }
.owner-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-anthony { background: var(--anthony); }
.dot-brian   { background: var(--brian); }
.dot-both    { background: var(--both); }
.dot-unassigned { background: var(--border); }

/* ── Legend ──────────────────────────────────────────── */
.legend {
  display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font-size: 11px; color: var(--fg2);
}
.legend-item { display: flex; align-items: center; gap: 5px; }

/* ── Empty state ──────────────────────────────────────── */
.empty-msg {
  text-align: center; padding: 24px 16px;
  color: var(--fg3); font-size: 13px; display: none;
}
</style>

// ── State ───────────────────────────────────────────────────────────────────
let state = {}; // id -> { done, owner }
let firebaseReady = false;

function seedDefaults() {
  SECTIONS.forEach(sec => sec.tasks.forEach(t => {
    if (!state[t.id]) state[t.id] = { done: t.done || false, owner: t.owner };
  }));
}

function loadState() {
  // Show defaults immediately while Firebase loads
  seedDefaults();
  renderAll();

  // Subscribe to Firebase for real-time sync
  checklistRef.on('value', snapshot => {
    const data = snapshot.val();
    if (data) {
      // Merge Firebase data over defaults (Firebase is source of truth)
      SECTIONS.forEach(sec => sec.tasks.forEach(t => {
        state[t.id] = {
          done: data[t.id]?.done ?? (t.done || false),
          owner: data[t.id]?.owner ?? t.owner
        };
      }));
    } else {
      // First load — push defaults to Firebase
      seedDefaults();
      const initial = {};
      SECTIONS.forEach(sec => sec.tasks.forEach(t => {
        initial[t.id] = state[t.id];
      }));
      checklistRef.set(initial).catch(() => {});
    }
    firebaseReady = true;
    renderAll();
  }, err => {
    // Firebase unavailable — fall back to localStorage
    console.warn('Firebase unavailable, using localStorage', err);
    try {
      const saved = localStorage.getItem('ktr_checklist_v2');
      if (saved) Object.assign(state, JSON.parse(saved));
    } catch(e) {}
    seedDefaults();
    renderAll();
  });
}

function saveState() {
  if (firebaseReady) {
    // Push full state to Firebase (real-time sync to Brian's device)
    checklistRef.set(state).catch(() => {
      // Fallback to localStorage if Firebase write fails
      try { localStorage.setItem('ktr_checklist_v2', JSON.stringify(state)); } catch(e) {}
    });
  } else {
    try { localStorage.setItem('ktr_checklist_v2', JSON.stringify(state)); } catch(e) {}
  }
}

// ── Filter state ─────────────────────────────────────────────────────────────
let activeFilter = 'all';
let activeOwner = null;

// ── Render ───────────────────────────────────────────────────────────────────
function ownerLabel(o) {
  if (o === 'anthony') return 'Anthony';
  if (o === 'brian')   return 'Brian';
  if (o === 'both')    return 'Both';
  return 'Assign';
}

function taskVisible(id) {
  const s = state[id];
  const doneMatch = activeFilter === 'all' || (activeFilter === 'done' && s.done) || (activeFilter === 'todo' && !s.done);
  const ownerMatch = !activeOwner || s.owner === activeOwner;
  return doneMatch && ownerMatch;
}

function buildTask(t, secEl) {
  const s = state[t.id];
  const row = document.createElement('div');
  row.className = 'task' + (s.done ? ' done' : '') + (taskVisible(t.id) ? '' : ' hidden');
  row.dataset.id = t.id;

  row.innerHTML = `
    <div class="task-check-col">
      <div class="task-check" data-check="${t.id}">
        <span class="task-check-icon">✓</span>
      </div>
    </div>
    <div class="task-body">
      <div class="task-name">${t.critical ? '<span class="task-critical">⚑ CRITICAL PATH &nbsp;</span>' : ''}${t.name}</div>
      ${t.note ? `<div class="task-note">${t.note}</div>` : ''}
      <div class="task-meta">
        <span class="task-deadline">🗓 ${t.deadline}</span>
      </div>
    </div>
    <div class="task-owner-col">
      <div class="owner-select" data-owner-id="${t.id}">
        <div class="owner-pill ${s.owner}" data-toggle="${t.id}">
          <span class="owner-dot dot-${s.owner}"></span>
          <span>${ownerLabel(s.owner)}</span>
          <span style="font-size:9px;opacity:.6">▾</span>
        </div>
        <div class="owner-dropdown" id="dd_${t.id}">
          ${['anthony','brian','both','unassigned'].map(o => `
            <div class="owner-opt" data-set-owner="${t.id}" data-val="${o}">
              <span class="owner-dot dot-${o}"></span>
              <span>${ownerLabel(o)}</span>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  return row;
}

function renderAll() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  SECTIONS.forEach(sec => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.dataset.sec = sec.num;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `<span class="section-num">${sec.num}</span><span class="section-title">${sec.title}</span><span class="section-count" id="sc_${sec.num}"></span><span class="section-chevron">▾</span>`;
    hdr.addEventListener('click', () => {
      secEl.classList.toggle('collapsed');
    });
    secEl.appendChild(hdr);

    const body = document.createElement('div');
    body.className = 'section-body';
    sec.tasks.forEach(t => body.appendChild(buildTask(t, secEl)));
    secEl.appendChild(body);
    container.appendChild(secEl);
  });
  attachEvents();
  updateProgress();
  updateFilterVisibility();
}

function updateProgress() {
  let total = 0, done = 0;
  SECTIONS.forEach(sec => {
    sec.tasks.forEach(t => {
      total++;
      if (state[t.id]?.done) done++;
    });
  });
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total} done`;

  // section counts
  SECTIONS.forEach(sec => {
    const el = document.getElementById(`sc_${sec.num}`);
    if (!el) return;
    const sdone = sec.tasks.filter(t => state[t.id]?.done).length;
    el.textContent = `${sdone}/${sec.tasks.length}`;
  });
}

function updateFilterVisibility() {
  let anyVisible = false;
  SECTIONS.forEach(sec => {
    let secVisible = false;
    const secEl = document.querySelector(`[data-sec="${sec.num}"]`);
    if (!secEl) return;
    sec.tasks.forEach(t => {
      const row = secEl.querySelector(`[data-id="${t.id}"]`);
      if (!row) return;
      const vis = taskVisible(t.id);
      row.classList.toggle('hidden', !vis);
      if (vis) { secVisible = true; anyVisible = true; }
    });
    secEl.classList.toggle('hidden', !secVisible);
  });
  document.getElementById('emptyMsg').style.display = anyVisible ? 'none' : 'block';
}

function refreshTask(id) {
  const s = state[id];
  const row = document.querySelector(`[data-id="${id}"]`);
  if (!row) return;
  row.classList.toggle('done', s.done);
  row.classList.toggle('hidden', !taskVisible(id));

  const pill = row.querySelector(`.owner-pill[data-toggle="${id}"]`);
  if (pill) {
    pill.className = `owner-pill ${s.owner}`;
    pill.innerHTML = `<span class="owner-dot dot-${s.owner}"></span><span>${ownerLabel(s.owner)}</span><span style="font-size:9px;opacity:.6">▾</span>`;
    pill.dataset.toggle = id;
  }
}

function attachEvents() {
  // checkboxes
  document.querySelectorAll('[data-check]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.check;
      state[id].done = !state[id].done;
      saveState();
      refreshTask(id);
      updateProgress();
      updateFilterVisibility();
    });
  });

  // owner toggles
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.toggle;
      closeAllDropdowns();
      document.getElementById('dd_' + id)?.classList.add('open');
    });
  });

  // owner options
  document.querySelectorAll('[data-set-owner]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.setOwner;
      const val = el.dataset.val;
      state[id].owner = val;
      saveState();
      closeAllDropdowns();
      refreshTask(id);
      updateFilterVisibility();
    });
  });

  document.addEventListener('click', closeAllDropdowns);
}

function closeAllDropdowns() {
  document.querySelectorAll('.owner-dropdown.open').forEach(d => d.classList.remove('open'));
}

// ── Filter buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    updateFilterVisibility();
  });
});

document.querySelectorAll('.filter-btn[data-owner]').forEach(btn => {
  btn.addEventListener('click', () => {
    if (activeOwner === btn.dataset.owner) {
      btn.classList.remove('active');
      activeOwner = null;
    } else {
      document.querySelectorAll('.filter-btn[data-owner]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeOwner = btn.dataset.owner;
    }
    updateFilterVisibility();
  });
});

// ── Boot ─────────────────────────────────────────────────────────────────────
loadState(); // renderAll() is called inside loadState() once Firebase responds
</script>
